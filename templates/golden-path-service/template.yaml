apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: golden-path-microservice
  title: Create Golden Path Service & Git Repo
  description: Scaffolds a service repository, asks for its cloud provider, and opens a Terraform PR in the IaC repository.
  tags:
    - golden-path
    - github
    - microservice
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Service Details
      required:
        - name
        - description
        - cloudProvider
      properties:
        name:
          title: Service Name
          type: string
          pattern: '^[a-z0-9-]+$'
        description:
          title: Description
          type: string
        language:
          title: Runtime Stack
          type: string
          default: nodejs
          enum: [nodejs, python, go]
        cloudProvider:
          title: Cloud Provider
          type: string
          default: aws
          enum: [aws, gcp, azure]
          enumNames:
            - Amazon Web Services (AWS)
            - Google Cloud Platform (GCP)
            - Microsoft Azure (Azure)

    - title: Target GitHub Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: New Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

    - title: Target IaC Repository
      required:
        - iacRepoUrl
      properties:
        iacRepoUrl:
          title: Infrastructure Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Render Golden Path Skeleton
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          language: ${{ parameters.language }}
          cloudProvider: ${{ parameters.cloudProvider }}

    - id: publish
      name: Create & Push GitHub Repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: ${{ parameters.description }}
        defaultBranch: main

    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    - id: fetch-iac
      name: Render Cloud Terraform Module
      action: fetch:template
      input:
        url: ../multi-cloud-infra/content
        targetPath: ./infra-output/${{ parameters.name }}-${{ parameters.cloudProvider }}
        values:
          cloudProvider: ${{ parameters.cloudProvider }}
          resourceName: ${{ parameters.name }}
          environment: dev
          billingCode: '448325'

    - id: publish-iac-pr
      name: Add Terraform Folder to IaC Repository
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.iacRepoUrl }}
        sourcePath: ./infra-output/${{ parameters.name }}-${{ parameters.cloudProvider }}
        targetPath: ${{ parameters.name }}-${{ parameters.cloudProvider }}
        branchName: add-${{ parameters.name }}-${{ parameters.cloudProvider }}-terraform
        title: 'feat(terraform): add ${{ parameters.name }} (${{ parameters.cloudProvider }})'
        description: 'Add the base Terraform module for `${{ parameters.name }}` on `${{ parameters.cloudProvider }}`.'
        update: true

  output:
    links:
      - title: Open GitHub Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: View Terraform Pull Request
        url: ${{ steps['publish-iac-pr'].output.remoteUrl }}
