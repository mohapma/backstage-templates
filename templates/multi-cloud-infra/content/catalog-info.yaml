apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: ${{ values.resourceName }}
  title: ${{ values.resourceName }} ${{ values.cloudProvider | upper }} infrastructure
  description: Terraform infrastructure project for ${{ values.resourceName }} on ${{ values.cloudProvider | upper }} (${{ values.environment }})
  tags:
    - ${{ values.cloudProvider }}
    - ${{ values.environment }}
  annotations:
    platform.io/billing-code: "${{ values.billingCode }}"
spec:
  type: ${{ values.cloudProvider }}
  owner: group:default/platform-team
  system: cloud-infra
