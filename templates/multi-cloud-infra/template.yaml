apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: multi-cloud-infra-provisioner
  title: Provision Multi-Cloud Infrastructure (AWS / GCP / Azure)
  description: Generates standardized Terraform code for AWS, GCP, or Azure and opens a GitHub PR.
  tags:
    - terraform
    - aws
    - gcp
    - azure
spec:
  owner: group:default/platform-team
  type: resource

  parameters:
    - title: Cloud Provider & Resource Details
      required:
        - cloudProvider
        - resourceName
        - environment
      properties:
        cloudProvider:
          title: Cloud Provider
          type: string
          default: gcp
          enum: [aws, gcp, azure]
          enumNames:
            - Amazon Web Services (AWS S3)
            - Google Cloud Platform (GCP Storage Bucket)
            - Microsoft Azure (Azure Storage Account)
        resourceName:
          title: Resource Name
          type: string
          pattern: '^[a-z0-9-]+$'
        environment:
          title: Environment
          type: string
          default: dev
          enum: [dev, staging, prod]
        billingCode:
          title: Cost Center / Billing ID
          type: string
          default: '448325'

    - title: Target Infrastructure Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Infrastructure Repo Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Render Multi-Cloud Terraform
      action: fetch:template
      input:
        url: ./content
        values:
          cloudProvider: ${{ parameters.cloudProvider }}
          resourceName: ${{ parameters.resourceName }}
          environment: ${{ parameters.environment }}
          billingCode: ${{ parameters.billingCode }}

    - id: publish-pr
      name: Open Infrastructure Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        branchName: infra-${{ parameters.cloudProvider }}-${{ parameters.resourceName }}
        title: 'feat(${{ parameters.cloudProvider }}): provision ${{ parameters.resourceName }}'
        description: 'Automated multi-cloud Terraform PR generated by Internal Developer Platform.'

  output:
    links:
      - title: View Pull Request
        url: ${{ steps['publish-pr'].output.remoteUrl }}
