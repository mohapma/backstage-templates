apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: multi-cloud-infra-provisioner
  title: Provision Multi-Cloud Infrastructure (AWS / GCP / Azure)
  description: Generates a cloud-specific Terraform project folder for AWS, GCP, or Azure and opens a GitHub PR.
  tags:
    - terraform
    - aws
    - gcp
    - azure
spec:
  owner: group:default/platform-team
  type: resource

  parameters:
    - title: Cloud Provider & Resource Details
      required:
        - cloudProvider
        - resourceName
        - environment
      properties:
        cloudProvider:
          title: Cloud Provider
          type: string
          default: gcp
          enum: [aws, gcp, azure]
          enumNames:
            - Amazon Web Services (AWS)
            - Google Cloud Platform (GCP)
            - Microsoft Azure (Azure)
        resourceName:
          title: Project or Service Name
          type: string
          pattern: '^[a-z0-9-]+$'
        environment:
          title: Environment
          type: string
          default: dev
          enum: [dev, staging, prod]
        billingCode:
          title: Cost Center / Billing ID
          type: string
          default: '448325'
      dependencies:
        cloudProvider:
          oneOf:
            - properties:
                cloudProvider:
                  const: gcp
                gcpProjectId:
                  title: New GCP Project ID
                  description: Enter a globally unique ID for the new Google Cloud project.
                  type: string
                  pattern: '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
              required: [gcpProjectId]
            - properties:
                cloudProvider:
                  enum: [aws, azure]

    - title: Target Infrastructure Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Infrastructure Repo Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Render Multi-Cloud Terraform
      action: fetch:template
      input:
        url: ./content
        targetPath: ./infra-output/${{ parameters.resourceName }}-${{ parameters.cloudProvider }}
        values:
          cloudProvider: ${{ parameters.cloudProvider }}
          resourceName: ${{ parameters.resourceName }}
          environment: ${{ parameters.environment }}
          billingCode: ${{ parameters.billingCode }}
          gcpProjectId: ${{ parameters.gcpProjectId }}

    - id: publish-pr
      name: Add Terraform Project Folder to IaC Repository
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        sourcePath: ./infra-output/${{ parameters.resourceName }}-${{ parameters.cloudProvider }}
        targetPath: ${{ parameters.resourceName }}-${{ parameters.cloudProvider }}
        branchName: add-${{ parameters.resourceName }}-${{ parameters.cloudProvider }}-terraform
        title: 'feat(terraform): add ${{ parameters.resourceName }} (${{ parameters.cloudProvider }})'
        description: 'Add the base Terraform module for `${{ parameters.resourceName }}` on `${{ parameters.cloudProvider }}`.'
        update: true

  output:
    links:
      - title: View IaC Pull Request
        url: ${{ steps['publish-pr'].output.remoteUrl }}
